# https://autofix.ci - applies formatting/lint fixes to pull requests.
# Requires the autofix.ci GitHub App to be installed on the repository.
name: autofix.ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autofix:
    name: autofix.ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - name: Apply ruff fixes
        run: |
          uv run ruff check --fix-only .
          uv run ruff format .
      - name: Refresh the lockfile
        run: uv lock
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
