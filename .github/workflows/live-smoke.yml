# Live smoke tests against the real GroupMe API, run before a release: every MCP
# tool, in the maintainer's dedicated test group's main chat and test topic.
# Manual only: each run posts about a dozen tagged messages there.
#
# Settings live on the protected `groupme-live-smoke` environment, never on the
# repository, so pull requests (including from forks) cannot reach them:
#   secret   GROUPME_ACCESS_TOKEN   GroupMe token of the test account
#   variable GROUPME_LIVE_GROUP_ID  the dedicated test group
#   variable GROUPME_LIVE_TOPIC_ID  a topic inside that group
# See AGENTS.md ("Integration tests") for what the suites may touch.
name: Live smoke

on:
  workflow_dispatch:

permissions: {}

concurrency:
  # Never two runs posting to the test topic at once.
  group: groupme-live-smoke
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  live-smoke:
    name: GroupMe live smoke
    if: github.repository == 'oddrationale/groupme-mcp-server'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: groupme-live-smoke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No shared cache in a job that holds secrets.
          enable-cache: false
      - run: uv sync --all-groups
      # The test suites read these from the repository .env only (the unit-test
      # conftest scrubs GROUPME_* from the environment), so write them there.
      # Fail instead of letting every live test skip and the run look green.
      - name: Write .env from the environment's secret and variables
        env:
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
          GROUPME_LIVE_GROUP_ID: ${{ vars.GROUPME_LIVE_GROUP_ID }}
          GROUPME_LIVE_TOPIC_ID: ${{ vars.GROUPME_LIVE_TOPIC_ID }}
        run: |
          umask 077
          : > .env
          for name in GROUPME_ACCESS_TOKEN GROUPME_LIVE_GROUP_ID GROUPME_LIVE_TOPIC_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the groupme-live-smoke environment"
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> .env
          done
      - name: pytest (live GroupMe API, read-only then writes, then stdio)
        run: >-
          uv run pytest -m integration --no-cov -v -rs
          tests/integration/test_groupme_live.py
          tests/integration/test_groupme_live_writes.py
          tests/integration/test_stdio_live.py
      - name: Remove .env
        if: always()
        run: rm -f .env
