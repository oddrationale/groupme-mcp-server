# https://docs.codecov.com/docs/codecovyml-reference
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "100...100"
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "condensed_header, diff, flags, components"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "scripts/**"
